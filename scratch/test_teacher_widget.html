<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teacher Avatar Test</title>
<style>
  :root {
    --color-primary: #E7192D;
    --color-primary-dark: #C81023;
    --font-mono: "SF Mono", "Fira Code", monospace;
  }
  body {
    margin: 0;
    min-height: 250vh;
    background: #FFFFFF;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .test-section {
    height: 80vh;
    padding: 40px;
    border-bottom: 2px dashed #eee;
  }

  /* Teacher Guide Floating Widget */
  .teacher-guide-widget {
    position: fixed;
    bottom: 24px;
    left: 24px;
    z-index: 95;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
    user-select: none;
    cursor: pointer;
    filter: drop-shadow(0 10px 25px rgba(0, 0, 0, 0.08));
    transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .teacher-guide-widget:hover {
    transform: translateY(-4px) scale(1.02);
  }

  /* Speech / Status Bubble */
  .teacher-speech-bubble {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: rgba(255, 255, 255, 0.96);
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
    border: 1.5px solid rgba(231, 25, 45, 0.28);
    border-radius: 9999px;
    padding: 6px 14px 6px 10px;
    box-shadow: 0 4px 14px rgba(231, 25, 45, 0.12), 0 2px 6px rgba(0, 0, 0, 0.04);
    font-family: var(--font-mono);
    font-size: 0.72rem;
    font-weight: 700;
    color: #111827;
    letter-spacing: 0.02em;
    white-space: nowrap;
    transition: all 0.3s ease;
  }
  .teacher-guide-widget:hover .teacher-speech-bubble {
    border-color: var(--color-primary);
    box-shadow: 0 6px 18px rgba(231, 25, 45, 0.22);
  }

  .teacher-status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--color-primary);
    box-shadow: 0 0 8px var(--color-primary);
    animation: teacherDotPulse 1.6s infinite ease-in-out;
  }
  @keyframes teacherDotPulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.4); opacity: 0.6; }
  }

  .teacher-speech-text {
    max-width: 170px;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Avatar Graphic Container */
  .teacher-avatar-wrapper {
    position: relative;
    width: 120px;
    height: 145px;
  }
  .teacher-avatar-svg {
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  /* Stick Arm Animations */
  .teacher-stick-arm {
    transform-origin: 42px 88px;
    transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .teacher-stick-arm.is-idle {
    animation: teacherArmIdle 4s ease-in-out infinite;
  }
  @keyframes teacherArmIdle {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(-3.5deg); }
  }

  .teacher-stick-arm.is-preparing {
    transform: rotate(-14deg);
    transition: transform 0.4s ease-out;
  }

  .teacher-stick-arm.is-pointing {
    animation: teacherStickPoint 1.35s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }
  @keyframes teacherStickPoint {
    0% { transform: rotate(-14deg); }
    30% { transform: rotate(40deg); } /* Decisive point down */
    70% { transform: rotate(36deg); }
    100% { transform: rotate(0deg); }
  }

  /* Spark effect at tip */
  .stick-pulse-waves {
    transform-origin: 98px 60px;
    opacity: 0;
  }
  .is-pointing .stick-pulse-waves {
    animation: sparkBurst 1.1s ease-out 0.3s forwards;
  }
  @keyframes sparkBurst {
    0% { transform: scale(0.3); opacity: 0; }
    40% { transform: scale(1.7); opacity: 1; }
    100% { transform: scale(2.6); opacity: 0; }
  }

  /* Eyes blinking */
  .teacher-eyes {
    transform-origin: 66px 50px;
    animation: teacherBlink 4.5s infinite;
  }
  @keyframes teacherBlink {
    0%, 94%, 98%, 100% { transform: scaleY(1); }
    96% { transform: scaleY(0.12); }
  }

  /* Gentle whole-body breathing */
  .teacher-body-float {
    animation: teacherBreathe 4s ease-in-out infinite;
    transform-origin: 68px 150px;
  }
  @keyframes teacherBreathe {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-2px); }
  }

  @media (max-width: 768px) {
    .teacher-guide-widget {
      bottom: 16px;
      left: 14px;
    }
    .teacher-avatar-wrapper {
      width: 95px;
      height: 115px;
    }
    .teacher-speech-bubble {
      font-size: 0.66rem;
      padding: 4px 10px 4px 8px;
    }
  }
</style>
</head>
<body>
  <div class="test-section"><h2>Section 1: Hero Overview</h2></div>
  <div class="test-section"><h2>Section 2: Brand Radar</h2></div>
  <div class="test-section"><h2>Section 3: Our Services</h2></div>

  <!-- Teacher Widget -->
  <aside class="teacher-guide-widget" id="teacherGuideWidget" aria-label="Baadam Presentation Guide" title="Click to advance section">
    <div class="teacher-speech-bubble" id="teacherSpeechBubble">
      <span class="teacher-status-dot"></span>
      <span class="teacher-speech-text" id="teacherSpeechText">Overview &bull; 01/07</span>
    </div>

    <div class="teacher-avatar-wrapper">
      <svg class="teacher-avatar-svg" viewBox="0 0 140 170" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="blazerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FF2E44"/>
            <stop offset="100%" stop-color="#B91424"/>
          </linearGradient>
          <filter id="stickGlow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="3" result="blur"/>
            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
          </filter>
        </defs>

        <!-- Soft ground shadow -->
        <ellipse cx="68" cy="164" rx="42" ry="6" fill="rgba(231,25,45,0.15)"/>

        <g class="teacher-body-float">
          <!-- Torso & Blazer -->
          <g class="teacher-torso">
            <!-- White blouse base -->
            <path d="M48 94 L68 114 L88 94 L84 148 L52 148 Z" fill="#FFFFFF" stroke="#F3F4F6" stroke-width="1"/>
            <path d="M68 102 L68 138" stroke="#E7192D" stroke-width="2" stroke-linecap="round"/>
            
            <!-- Red Blazer Body -->
            <path d="M40 94 C40 84 50 78 68 78 C86 78 96 84 96 94 L98 156 C98 160 93 163 86 163 L50 163 C43 163 38 160 38 156 Z" fill="url(#blazerGradient)"/>
            
            <!-- White Lapels -->
            <path d="M50 80 L68 115 L56 134 L42 100 Z" fill="#FFFFFF"/>
            <path d="M86 80 L68 115 L80 134 L94 100 Z" fill="#FFFFFF"/>
            
            <!-- White Blazer Buttons -->
            <circle cx="68" cy="126" r="2.5" fill="#FFFFFF"/>
            <circle cx="68" cy="142" r="2.5" fill="#FFFFFF"/>
          </g>

          <!-- Left Arm holding Baadam presentation notebook -->
          <g class="teacher-left-arm">
            <!-- Sleeve -->
            <path d="M94 92 Q108 108 101 126" stroke="#B91424" stroke-width="10" stroke-linecap="round"/>
            <!-- Notebook/Tablet (Red & White Brand) -->
            <rect x="94" y="114" width="22" height="30" rx="3.5" fill="#FFFFFF" stroke="#E7192D" stroke-width="1.8"/>
            <rect x="98" y="120" width="14" height="2.5" rx="1" fill="#E7192D"/>
            <rect x="98" y="125" width="10" height="2" rx="1" fill="#E7192D" opacity="0.6"/>
            <rect x="98" y="130" width="12" height="2" rx="1" fill="#E7192D" opacity="0.4"/>
            <!-- Hand holding notebook -->
            <circle cx="97" cy="127" r="4.5" fill="#FDDEC3"/>
          </g>

          <!-- Head & Face -->
          <g class="teacher-head">
            <!-- Neck -->
            <path d="M61 70 L75 70 L73 82 L63 82 Z" fill="#FDDEC3"/>
            <!-- Hair Bun (Dark brunette) -->
            <circle cx="68" cy="30" r="14" fill="#221919"/>
            <circle cx="68" cy="30" r="15.5" stroke="#E7192D" stroke-width="1.5" stroke-dasharray="6 3" fill="none"/>
            <!-- Face -->
            <ellipse cx="68" cy="52" rx="18" ry="19.5" fill="#FDDEC3"/>
            <!-- Front Bangs / Hair -->
            <path d="M50 46 C51 32 59 26 68 26 C77 26 85 32 86 46 C81 38 73 36 68 40 C63 36 55 38 50 46 Z" fill="#221919"/>
            
            <!-- Red Earrings -->
            <circle cx="50" cy="54" r="2.2" fill="#E7192D"/>
            <circle cx="86" cy="54" r="2.2" fill="#E7192D"/>

            <!-- Soft Blush on Cheeks -->
            <ellipse cx="57" cy="57" rx="3.5" ry="2" fill="#E7192D" opacity="0.22"/>
            <ellipse cx="79" cy="57" rx="3.5" ry="2" fill="#E7192D" opacity="0.22"/>

            <!-- Friendly Smile -->
            <path d="M63 61 Q68 65 73 61" stroke="#B91424" stroke-width="1.8" stroke-linecap="round" fill="none"/>

            <!-- Eyes -->
            <g class="teacher-eyes">
              <ellipse cx="59" cy="49" rx="2.2" ry="2.6" fill="#221919"/>
              <ellipse cx="77" cy="49" rx="2.2" ry="2.6" fill="#221919"/>
              <circle cx="58.2" cy="48.2" r="0.75" fill="#FFFFFF"/>
              <circle cx="76.2" cy="48.2" r="0.75" fill="#FFFFFF"/>
            </g>
            <path d="M56 43.5 Q59 41.5 62 43.5" stroke="#221919" stroke-width="1.2" stroke-linecap="round" fill="none"/>
            <path d="M74 43.5 Q77 41.5 80 43.5" stroke="#221919" stroke-width="1.2" stroke-linecap="round" fill="none"/>

            <!-- Red Teacher Glasses -->
            <rect x="53" y="44" width="12" height="10" rx="3" fill="none" stroke="#E7192D" stroke-width="1.8"/>
            <rect x="71" y="44" width="12" height="10" rx="3" fill="none" stroke="#E7192D" stroke-width="1.8"/>
            <path d="M65 48 L71 48" stroke="#E7192D" stroke-width="1.8"/>
            <path d="M53 47 L49 45.5" stroke="#E7192D" stroke-width="1.4"/>
            <path d="M83 47 L87 45.5" stroke="#E7192D" stroke-width="1.4"/>
          </g>

          <!-- Right Arm holding Teacher Pointer Stick (Animated) -->
          <g class="teacher-stick-arm is-idle" id="teacherStickArm">
            <!-- Sleeve -->
            <path d="M42 90 Q28 104 36 120" stroke="#B91424" stroke-width="10" stroke-linecap="round"/>
            <circle cx="36" cy="120" r="4.5" fill="#FFFFFF"/> <!-- White cuff -->
            
            <!-- Hand -->
            <circle cx="35" cy="122" r="4.8" fill="#FDDEC3"/>

            <!-- Teacher Pointer Stick -->
            <!-- Handle -->
            <path d="M31 130 L36 117" stroke="#E7192D" stroke-width="4.5" stroke-linecap="round"/>
            <!-- White & Red Presentation Shaft -->
            <path d="M36 117 L98 60" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
            <path d="M36 117 L98 60" stroke="#E7192D" stroke-width="1.2" stroke-dasharray="8 4"/>
            <!-- Glowing Red Pointer Tip -->
            <circle cx="101" cy="57" r="6" fill="#E7192D" filter="url(#stickGlow)"/>
            <circle cx="101" cy="57" r="3" fill="#FFFFFF"/>
            
            <!-- Spark / Pulse wave emitted on cue -->
            <g class="stick-pulse-waves">
              <circle cx="101" cy="57" r="10" stroke="#E7192D" stroke-width="2.5" fill="none" opacity="0.85"/>
              <path d="M101 44 L101 70 M88 57 L114 57" stroke="#E7192D" stroke-width="2" stroke-linecap="round"/>
            </g>
          </g>
        </g>
      </svg>
    </div>
  </aside>

  <script>
    // Quick test helper
    const widget = document.getElementById('teacherGuideWidget');
    const arm = document.getElementById('teacherStickArm');
    const speech = document.getElementById('teacherSpeechText');

    widget.addEventListener('click', () => {
      // Wind up
      arm.className = 'teacher-stick-arm is-preparing';
      speech.textContent = 'Next Section ↘';

      setTimeout(() => {
        // Point down!
        arm.className = 'teacher-stick-arm is-pointing';

        // Trigger scroll right on the tap
        setTimeout(() => {
          window.scrollBy({ top: window.innerHeight * 0.8, behavior: 'smooth' });
        }, 320);

        // Return to idle
        setTimeout(() => {
          arm.className = 'teacher-stick-arm is-idle';
          speech.textContent = 'Guiding Baadam';
        }, 1350);
      }, 350);
    });
  </script>
</body>
</html>
