<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script>window.location.replace('/admin/homepage/index.html#how-we-work');</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How We Work Editor | BAADAM CMS</title>
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>

  <div class="admin-wrapper">
    <aside class="admin-sidebar" id="admin-sidebar"></aside>

    <main class="admin-main">
      <header class="admin-topbar" id="admin-topbar"></header>

      <div class="admin-content">

        <!-- Action bar -->
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:16px; margin-bottom:24px;">
          <div>
            <div style="display:flex; align-items:center; gap:8px;">
              <h2 style="font-size:22px; font-weight:700; color:#111827; margin:0;">How We Work Editor</h2>
              <span id="section-status-badge" class="badge badge-published">Published</span>
            </div>
            <p style="font-size:14px; color:#6B7280; margin:4px 0 0 0;">Manage the 4 delivery stages (Reach, Launch, Optimise, Scale), progress bars, timelines, and conversion metrics.</p>
          </div>
          <div style="display:flex; gap:10px;">
            <button type="button" class="btn btn-secondary" onclick="openPreviewModal('process')">
              Preview
            </button>
            <button type="button" class="btn btn-secondary" onclick="revertDraft()">
              Revert
            </button>
            <button type="button" class="btn btn-secondary" onclick="saveSection(false)">
              Save Draft
            </button>
            <button type="button" class="btn btn-primary" onclick="saveSection(true)">
              Publish Changes
            </button>
          </div>
        </div>

        <!-- Section Global Settings -->
        <div class="card" style="margin-bottom:24px;">
          <div class="card-header">
            <div>
              <h3 class="card-title">How We Work Header &amp; Subtitle</h3>
              <p class="card-subtitle">Global text for the execution funnel</p>
            </div>
          </div>
          <div class="form-grid">
            <div class="form-group">
              <label class="form-label" for="hww_badge">Section Label / Badge</label>
              <input type="text" id="hww_badge" class="form-control" placeholder="[ OUR PROCESS ]">
            </div>
            <div class="form-group">
              <label class="form-label" for="hww_heading">Section Main Heading</label>
              <input type="text" id="hww_heading" class="form-control" placeholder="A Streamlined 4-Stage Methodology">
            </div>
            <div class="form-group" style="grid-column:1/-1;">
              <label class="form-label" for="hww_subtitle">Section Description</label>
              <textarea id="hww_subtitle" class="form-control" rows="2"></textarea>
            </div>
          </div>
        </div>

        <!-- 4 Stages Grid -->
        <div id="stages-container" style="display:grid; grid-template-columns:repeat(auto-fit, minmax(320px, 1fr)); gap:20px; margin-bottom:40px;">
          <!-- 4 stage cards -->
        </div>

        <div style="display:flex; justify-content:flex-end; gap:12px; margin-bottom:40px;">
          <button type="button" class="btn btn-secondary" onclick="saveSection(false)">Save Draft</button>
          <button type="button" class="btn btn-primary" onclick="saveSection(true)">Publish Changes</button>
        </div>

      </div>
    </main>
  </div>

  <script src="/admin/admin-core.js"></script>
  <script>
    setupAdminLayout({
      activeNav: 'how-we-work',
      title: 'How We Work Editor',
      breadcrumbs: [
        { label: 'Admin', url: '/admin/dashboard.html' },
        { label: 'Homepage', url: '/admin/homepage/index.html' },
        { label: 'How We Work', url: '/admin/homepage/how-we-work.html' }
      ]
    });

    let currentData = null;
    let stagesList = [];

    async function loadData() {
      try {
        const res = await fetch('/api/admin/homepage/how-we-work');
        const data = await res.json();
        currentData = data.draft || data.published || {};

        const statusBadge = document.getElementById('section-status-badge');
        if (data.status === 'draft') {
          statusBadge.className = 'badge badge-draft';
          statusBadge.textContent = 'Draft Changes';
        } else {
          statusBadge.className = 'badge badge-published';
          statusBadge.textContent = 'Published';
        }

        document.getElementById('hww_badge').value = currentData.section_badge || '[ OUR PROCESS ]';
        document.getElementById('hww_heading').value = currentData.heading || 'A Streamlined 4-Stage Methodology';
        document.getElementById('hww_subtitle').value = currentData.subtitle || '';

        stagesList = JSON.parse(JSON.stringify(currentData.stages || []));
        renderStages();
      } catch (err) {
        showToast('Error loading stages: ' + err.message, 'error');
      }
    }

    function renderStages() {
      const container = document.getElementById('stages-container');
      container.innerHTML = stagesList.map((stg, idx) => `
        <div class="card" style="margin-bottom:0;">
          <div class="card-header" style="background:#F8FAFC;">
            <div style="display:flex; align-items:center; gap:10px;">
              <span style="background:#E7192D; color:#fff; font-weight:800; padding:3px 8px; border-radius:4px; font-size:12px;">Stage ${stg.number || ('0' + (idx+1))}</span>
              <h4 style="margin:0; font-size:16px; font-weight:700; color:#111827;">${stg.title || 'Stage Title'}</h4>
            </div>
          </div>
          <div class="card-body" style="padding:16px;">
            <div class="form-group" style="margin-bottom:12px;">
              <label class="form-label">Stage Title</label>
              <input type="text" class="form-control" value="${stg.title || ''}" oninput="updateStage(${idx}, 'title', this.value)" required>
            </div>
            <div class="form-group" style="margin-bottom:12px;">
              <label class="form-label">Stage Number</label>
              <input type="text" class="form-control" value="${stg.number || ('0' + (idx+1))}" oninput="updateStage(${idx}, 'number', this.value)" required>
            </div>
            <div class="form-group" style="margin-bottom:12px;">
              <label class="form-label">Description</label>
              <textarea class="form-control" rows="3" oninput="updateStage(${idx}, 'description', this.value)">${stg.description || ''}</textarea>
            </div>
            <div class="form-grid" style="grid-template-columns:1fr 1fr; gap:10px;">
              <div class="form-group" style="margin-bottom:10px;">
                <label class="form-label">Timeline / Duration</label>
                <input type="text" class="form-control" value="${stg.timeline || 'Weeks 1-2'}" oninput="updateStage(${idx}, 'timeline', this.value)">
              </div>
              <div class="form-group" style="margin-bottom:10px;">
                <label class="form-label">Progress %</label>
                <input type="number" class="form-control" value="${stg.progress_percent ?? 25}" oninput="updateStage(${idx}, 'progress_percent', parseInt(this.value)||0)">
              </div>
              <div class="form-group" style="margin-bottom:0;">
                <label class="form-label">Metric Value</label>
                <input type="text" class="form-control" value="${stg.metric_value || ''}" oninput="updateStage(${idx}, 'metric_value', this.value)">
              </div>
              <div class="form-group" style="margin-bottom:0;">
                <label class="form-label">Metric Label</label>
                <input type="text" class="form-control" value="${stg.metric_label || ''}" oninput="updateStage(${idx}, 'metric_label', this.value)">
              </div>
            </div>
          </div>
        </div>
      `).join('');
    }

    function updateStage(idx, prop, val) {
      stagesList[idx][prop] = val;
    }

    async function saveSection(publish = false) {
      const payload = {
        section_badge: document.getElementById('hww_badge').value.trim(),
        heading: document.getElementById('hww_heading').value.trim(),
        subtitle: document.getElementById('hww_subtitle').value.trim(),
        stages: stagesList
      };

      try {
        const res = await fetch('/api/admin/homepage/how-we-work', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (!data.success) {
          showToast(data.error || 'Failed to save draft', 'error');
          return;
        }

        if (publish) {
          const pubRes = await fetch('/api/admin/homepage/how-we-work/publish', { method: 'POST' });
          const pubData = await pubRes.json();
          if (pubData.success) {
            showToast('How We Work published live successfully!');
          } else {
            showToast(pubData.error || 'Draft saved, but failed to publish live', 'error');
          }
        } else {
          showToast('Draft saved successfully!');
        }
        loadData();
      } catch (err) {
        showToast('Error saving: ' + err.message, 'error');
      }
    }

    async function revertDraft() {
      if (!confirm('Revert all unsaved draft changes back to published state?')) return;
      try {
        const res = await fetch('/api/admin/homepage/how-we-work/revert', { method: 'POST' });
        const data = await res.json();
        if (data.success) {
          showToast('Draft reverted to published state');
          loadData();
        } else {
          showToast(data.error || 'Failed to revert draft', 'error');
        }
      } catch (err) {
        showToast('Error: ' + err.message, 'error');
      }
    }

    loadData();
  </script>
</body>
</html>
