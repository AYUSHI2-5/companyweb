<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avatar Hand Motion Test</title>
<style>
  body {
    background: #f8fafc;
    margin: 40px;
    font-family: sans-serif;
  }
  .test-container {
    position: relative;
    width: 220px;
    height: 280px;
    background: white;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    overflow: hidden;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }

  .teacher-avatar-wrapper {
    position: relative;
    width: 200px;
    height: 256px;
  }

  .teacher-body-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }

  .teacher-hand-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    transform-origin: 30% 55%;
    transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  /* Stylus glowing tip */
  .teacher-wand-beacon {
    position: absolute;
    left: 24.8%;
    top: 33.1%;
    width: 12px;
    height: 12px;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }
  .wand-core-glow {
    position: absolute;
    inset: 1px;
    border-radius: 50%;
    background: #E7192D;
    box-shadow: 0 0 10px #E7192D, 0 0 18px rgba(231,25,45,0.8);
  }
  .wand-burst-spark {
    position: absolute;
    inset: -6px;
    border-radius: 50%;
    opacity: 0;
  }

  /* States */
  .teacher-avatar-wrapper.is-idle .teacher-hand-layer {
    animation: handIdleSway 4s ease-in-out infinite;
  }
  @keyframes handIdleSway {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(-2deg); }
  }

  .teacher-avatar-wrapper.is-preparing .teacher-hand-layer {
    transform: rotate(-14deg) translateY(-4px);
  }

  .teacher-avatar-wrapper.is-pointing .teacher-hand-layer {
    animation: handPointAndTap 1.35s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }

  @keyframes handPointAndTap {
    0% { transform: rotate(-14deg) translateY(-4px); }
    32% { transform: rotate(26deg) translateY(6px); } /* Decisive tap & point! */
    70% { transform: rotate(20deg) translateY(4px); }
    100% { transform: rotate(0deg) translateY(0); }
  }

  .teacher-avatar-wrapper.is-pointing .wand-burst-spark {
    animation: wandBurst 1.1s ease-out 0.28s forwards;
  }
  @keyframes wandBurst {
    0% { transform: scale(0.3); opacity: 0; }
    35% { transform: scale(2.4); opacity: 1; box-shadow: 0 0 24px #E7192D, 0 0 40px rgba(231,25,45,0.9); }
    100% { transform: scale(3.5); opacity: 0; }
  }
</style>
</head>
<body>
  <h2>Interactive Test: Hand & Stick Movement</h2>
  <div class="test-container">
    <div class="teacher-avatar-wrapper is-idle" id="avatarWrap">
      <img src="../assets/teacher-body-layer.png" class="teacher-body-layer" alt="Body" />
      <div class="teacher-hand-layer" id="handLayer">
        <img src="../assets/teacher-hand-layer.png" style="width:100%;height:100%;object-fit:contain;" alt="Hand" />
        <div class="teacher-wand-beacon">
          <span class="wand-core-glow"></span>
          <span class="wand-burst-spark"></span>
        </div>
      </div>
    </div>
  </div>

  <div style="margin-top: 20px;">
    <button onclick="triggerScrollCue()">Trigger Scroll Animation</button>
  </div>

  <script>
    function triggerScrollCue() {
      const wrap = document.getElementById('avatarWrap');
      wrap.className = 'teacher-avatar-wrapper is-preparing';
      setTimeout(() => {
        wrap.className = 'teacher-avatar-wrapper is-pointing';
        setTimeout(() => {
          wrap.className = 'teacher-avatar-wrapper is-idle';
        }, 1350);
      }, 400);
    }
  </script>
</body>
</html>
